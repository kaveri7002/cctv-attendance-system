services:
  - type: web
    name: cctv-attendance-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: campus-admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: TEST_MODE
        value: "false"
      - key: SMS_PROVIDER
        value: demo
      - key: CAMERA_SOURCE
        value: "0"
