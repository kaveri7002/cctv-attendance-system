<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="topbar">
        <div class="brand">Campus CCTV Attendance</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('register_page') }}">Register</a>
            <a href="{{ url_for('attendance_page') }}">Attendance</a>
            <a href="{{ url_for('live_page') }}">Live CCTV</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <main class="container form-layout">
        <section class="panel">
            <h2>Student Registration</h2>
            <form id="studentForm">
                <div class="row-grid">
                    <div class="field-group">
                        <label>Student ID</label>
                        <input type="text" name="student_id" required>
                    </div>
                    <div class="field-group">
                        <label>Name</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="field-group">
                        <label>Department</label>
                        <input type="text" name="department" required>
                    </div>
                    <div class="field-group">
                        <label>Semester</label>
                        <input type="text" name="semester" required>
                    </div>
                    <div class="field-group">
                        <label>Phone</label>
                        <input type="tel" name="phone" required>
                    </div>
                    <div class="field-group">
                        <label>Email</label>
                        <input type="email" name="email" required>
                    </div>
                </div>
                <div class="camera-box">
                    <video id="camera" autoplay playsinline muted></video>
                    <canvas id="snapshotCanvas" width="640" height="480" style="display:none"></canvas>
                </div>

                <div class="capture-actions">
                    <button type="button" id="captureBtn" class="primary-btn">Capture Face</button>
                    <button type="button" id="submitBtn" class="success-btn">Register Student</button>
                </div>

                <div id="capturePreview" class="capture-preview"></div>
                <div id="messageBox" class="message-box"></div>
            </form>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
