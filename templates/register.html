<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="topbar">
        <div class="brand">Campus Attendance Hub</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Overview</a>
            <a href="{{ url_for('register_page') }}">Register</a>
            <a href="{{ url_for('attendance_page') }}">Attendance</a>
            <a href="{{ url_for('live_page') }}">Live CCTV</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <main class="container form-layout">
        <section class="panel">
            <h2>Register a New Student</h2>
            <p class="section-note">Add student details and capture a clear face profile from the camera.</p>
            <form id="studentForm">
                <div class="row-grid">
                    <div class="field-group">
                        <label>Student ID</label>
                        <input type="text" name="student_id" required placeholder="e.g. STU001">
                    </div>
                    <div class="field-group">
                        <label>Name</label>
                        <input type="text" name="name" required placeholder="Student full name">
                    </div>
                    <div class="field-group">
                        <label>Department</label>
                        <input type="text" name="department" required placeholder="Department">
                    </div>
                    <div class="field-group">
                        <label>Semester</label>
                        <input type="text" name="semester" required placeholder="Semester">
                    </div>
                    <div class="field-group">
                        <label>Phone</label>
                        <input type="tel" name="phone" required placeholder="Mobile number">
                    </div>
                    <div class="field-group">
                        <label>Email</label>
                        <input type="email" name="email" required placeholder="Email address">
                    </div>
                </div>
                <div class="camera-box">
                    <video id="camera" autoplay playsinline muted></video>
                    <canvas id="snapshotCanvas" width="640" height="480" style="display:none"></canvas>
                </div>

                <div class="capture-actions">
                    <button type="button" id="captureBtn" class="primary-btn">Capture Face</button>
                    <button type="submit" id="submitBtn" class="success-btn">Save Student</button>
                </div>
                <div id="capturePreview" class="capture-preview"></div>
                <div id="messageBox" class="message-box" role="status" aria-live="polite"></div>
            </form>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
