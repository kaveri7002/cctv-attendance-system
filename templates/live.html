<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live CCTV</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="topbar">
        <div class="brand">Campus Attendance Hub</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Overview</a>
            <a href="{{ url_for('register_page') }}">Register</a>
            <a href="{{ url_for('attendance_page') }}">Attendance</a>
            <a href="{{ url_for('live_page') }}">Live CCTV</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <main class="container live-layout">
        <section class="panel live-panel">
            <h2>Live Entry Monitor</h2>
            <p class="section-note">Allow camera access. Attendance is marked after the same registered face is confirmed across three frames.</p>
            <div class="field-group camera-selector-group">
                <label for="liveCamera">Camera</label>
                <select id="liveCamera" aria-label="Select camera">
                    <option value="">Detecting cameras…</option>
                </select>
            </div>
            <video id="cameraFeed" autoplay playsinline muted aria-label="Live attendance camera preview"></video>
            <canvas id="frameCanvas" width="640" height="480" hidden></canvas>
            <p id="liveMessage" class="message-box" role="status">Requesting camera access…</p>
        </section>
        <aside class="panel status-panel">
            <h3>Recognition Status</h3>
            <div class="status-box">
                <span id="statusName" class="status-pill neutral">Unknown</span>
                <span id="statusId">ID: -</span>
                <span id="statusConfidence">Confidence: 0.00</span>
                <span id="statusDetail">Waiting for camera</span>
            </div>
        </aside>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
